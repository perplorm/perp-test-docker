services:
  db_server:
    image: mysql
    container_name: 'perpl-test-mysql'
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: perpl
      MYSQL_USER: perpl
      MYSQL_PASSWORD: perpl
      MYSQL_DATABASE: perpl
    volumes:
      - ./mysql-container-setup/mysql.setup.sql:/docker-entrypoint-initdb.d/init.sql
    tmpfs:
      - /var/lib/mysql/:rw,noexec,nosuid
    command: [
      'mysqld', 
      '--character-set-server=utf8mb4', 
      '--collation-server=utf8mb4_unicode_ci'
    ]
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 5s
      retries: 5
    networks:
      - perpl-test-net
